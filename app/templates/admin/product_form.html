{% extends "admin/base.html" %}{% block title %}Product{% endblock %}
{% block content %}
<h1>{{ 'Edit' if product else 'Add' }} product</h1>
<form method="post" action="/admin/products/save" enctype="multipart/form-data" class="card">
<input type="hidden" name="csrf_token" value="{{ csrf }}">{% if product %}<input type="hidden" name="id" value="{{ product.id }}">{% endif %}
<div class="grid2">
<div><label>Name (English)</label><input name="name_en" required value="{{ product.name_en if product }}"></div>
<div><label>పేరు (Telugu)</label><input name="name_te" required value="{{ product.name_te if product }}"></div>
<div><label>Description (English)</label><textarea name="description_en" rows="3">{{ product.description_en if product }}</textarea></div>
<div><label>వివరణ (Telugu)</label><textarea name="description_te" rows="3">{{ product.description_te if product }}</textarea></div>
<div><label>Price per kg (₹)</label><input name="price_per_kg" required inputmode="decimal" value="{{ product.price_per_kg|money if product }}"></div>
<div><label>Stock on hand (kg){% if product %} — reserved by open orders: {{ product.inventory.quantity_reserved|qty if product.inventory else 0 }}{% endif %}</label><input name="stock_on_hand" required inputmode="decimal" value="{{ product.inventory.quantity_on_hand|qty if product and product.inventory else 0 }}"></div>
<div><label>Minimum order (kg)</label><input name="min_qty" required inputmode="decimal" value="{{ product.min_qty|qty if product else 1 }}"></div>
<div><label>Maximum order (kg, optional)</label><input name="max_qty" inputmode="decimal" value="{{ product.max_qty|qty if product and product.max_qty else '' }}"></div>
<div><label>Sort order</label><input name="sort_order" type="number" value="{{ product.sort_order if product else 0 }}"></div>
<div><label>Photo (JPG/PNG/WEBP, max 3 MB)</label><input type="file" name="image" accept="image/jpeg,image/png,image/webp">
{% if product and product.image_path %}<img class="thumb" src="/media/{{ product.image_path }}" alt="">{% endif %}</div>
</div>
<label class="check"><input type="checkbox" name="allow_decimal" {{ 'checked' if (not product) or product.allow_decimal }}> Allow decimal quantities (e.g. 2.5 kg)</label>
<label class="check"><input type="checkbox" name="is_active" {{ 'checked' if (not product) or product.is_active }}> Available to customers</label>
<p><button class="btn">Save</button> <a class="btn ghost" href="/admin/products">Cancel</a></p>
</form>
{% endblock %}
