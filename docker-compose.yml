# Production-style stack: PostgreSQL + app + Caddy (automatic HTTPS via Let's Encrypt).  NOT yet tested here.
# 1. Copy .env.example to .env and fill it in (ENVIRONMENT=production, strong SECRET_KEY, ADMIN_PASSWORD,
#    PAYMENT_PROVIDER=cashfree + CASHFREE_*, WHATSAPP_*, PUBLIC_BASE_URL=https://<DOMAIN>).
# 2. Also set in .env:  DOMAIN=farm.example.com   POSTGRES_SUPERUSER_PASSWORD=...   POSTGRES_APP_PASSWORD=...
# 3. docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres                       # superuser: used only by the init script below
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init-db.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mango_app -d mango_farm"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mango_app:${POSTGRES_APP_PASSWORD}@db:5432/mango_farm
      ENVIRONMENT: production
      ENABLE_SIMULATOR: "false"
    volumes: ["uploads:/srv/data/uploads"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to app:8000
    volumes: ["caddy_data:/data"]

volumes:
  pgdata:
  uploads:
  caddy_data:
